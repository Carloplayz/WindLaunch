plugins {
    id 'fabric-loom' version '1.15.3'
}

group = 'com.mod'
version = '1.0.5'
base {
    archivesName.set('windlaunch')  // Correct way to set the archives base name
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.4'
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.2+1.21.11'
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21)
}

java {
    withSourcesJar()
}
